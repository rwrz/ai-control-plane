# Per-model pricing in USD per million tokens. Update freely as providers
# change pricing. Token counts come from the provider's own usage payload — no
# estimation. Cost math (see internal/pricing):
#
#   uncached_input = input_tokens - cached_input_tokens
#   cost = uncached_input      * input_per_mtok        / 1e6
#        + cached_input_tokens * cached_input_per_mtok / 1e6
#        + output_tokens       * output_per_mtok       / 1e6
#
# Model ids are version-pinned so a provider-side alias update can't silently
# re-cost. Response model ids are normalized (dated snapshots stripped) before
# lookup — see pricing.NormalizeModel.

# --- OpenAI gpt-5.6 family (standard tier, rates confirmed 2026-07-31) -----
#
# These carry SHORT-CONTEXT rates (prompts under 272K tokens). OpenAI bills a
# request whose input exceeds 272K at 2x input / 1.5x output, and this table has
# one rate per model, so such a call under-bills. That is the safe direction —
# a wrong high rate would over-charge every ordinary call to fix a rare one —
# and no the agents service prompt comes near the threshold. Revisit if a long-context
# consumer appears.
#
# The published cache-WRITE rate (luna $0.25/Mtok) has no column here either;
# cache writes are billed by OpenAI as ordinary input tokens in the usage
# payload, so they land on input_per_mtok.

[models."gpt-5.6-sol"]
input_per_mtok        = 5.00
cached_input_per_mtok = 0.50
output_per_mtok       = 30.00

[models."gpt-5.6-terra"]
input_per_mtok        = 2.00
cached_input_per_mtok = 0.20
output_per_mtok       = 12.00

[models."gpt-5.6-luna"]
input_per_mtok        = 0.20
cached_input_per_mtok = 0.02
output_per_mtok       = 1.20

# gpt-6-luna is a different, cheaper model than gpt-5.6-luna, not a rename of it. Same
# short-context caveat as above.
[models."gpt-6-luna"]
input_per_mtok        = 0.10
cached_input_per_mtok = 0.01
output_per_mtok       = 0.50

[models."gpt-5"]
input_per_mtok        = 1.25
cached_input_per_mtok = 0.125
output_per_mtok       = 10.00

[models."gpt-5-mini"]
input_per_mtok        = 0.25
cached_input_per_mtok = 0.025
output_per_mtok       = 2.00

[models."gpt-4o-mini"]
input_per_mtok        = 0.15
cached_input_per_mtok = 0.075
output_per_mtok       = 0.60

