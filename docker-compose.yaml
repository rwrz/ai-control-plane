# Local development only: a single insecure CockroachDB node.
# `make up && make migrate && make run`
services:
  cockroachdb:
    image: cockroachdb/cockroach:v25.4.4
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health?ready=1"]
      interval: 2s
      retries: 30
